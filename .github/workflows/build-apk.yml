name: Build Dynamic Island Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Prepare stable release signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Add release signing secrets before publishing: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dynamic-island-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dynamic-island-release.jks" >> "$GITHUB_ENV"

      - name: Build APK with Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          set +e
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          else
            ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E "e: |ERROR:|FAILURE:|What went wrong" -A 3 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Rename and Stage APK
        run: |
          mkdir -p build_output
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cp app/build/outputs/apk/debug/*.apk build_output/DynamicIsland-debug.apk
          else
            cp app/build/outputs/apk/release/*.apk build_output/DynamicIsland-v1.5.0.apk
          fi
          ls -la build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-APK
          path: build_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "Dynamic Island Android v1.5.0"
          body: |
            ### Dynamic Island for Android

            This update improves privacy and uses a production signing key:
            - Removes unused public-IP checks and Internet/network-state permissions.
            - Makes boot startup opt-in and disables Android backup for app data.
            - Publishes a release-signed APK; release signing secrets must be configured in the repository.

            This update also keeps the island glanceable:
            - The idle notch stays hidden until media, timers, calls, notifications, navigation, or a short alert is active.
            - Notch taps reliably open and close the combined panel, with touch handling exposed to accessibility services.
            - Compact island animations fade and scale smoothly as activity starts and ends.
            - The app settings screen gets a softer layered dark background and keeps advanced controls collapsed until requested.
            - Expanded panel height is capped, scrolls when needed, and uses smaller artwork and controls.
            - Live music controls with compact album art, current player name, seeking, progress, and volume.
            - Battery level, reported charging power, an estimated time to full when available, and low-battery alerts.
            - Persistent 5, 15, and 30 minute countdown timers with pause, resume, stop, and completion alerts.
            - Google Maps next-turn directions, ETA, and live distance shown in meters.
            - Answer and decline buttons when the calling app publishes those actions in its notification.
            - Mark as read for notifications that expose a supported action.
          files: build_output/DynamicIsland-v1.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
