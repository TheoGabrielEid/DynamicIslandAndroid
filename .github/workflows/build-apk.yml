name: Build Dynamic Island Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "e: |ERROR:|FAILURE:|What went wrong" -A 3 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Rename and Stage APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/*.apk build_output/DynamicIsland-v1.1.0.apk
          ls -la build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-APK
          path: build_output/DynamicIsland-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Dynamic Island Android v1.1.0"
          body: |
            ### Dynamic Island for Android

            This update focuses the expanded island on the features used at a glance:
            - Live music controls with larger album art, current player name, seeking, progress, and volume.
            - Battery level, reported charging power, an estimated time to full when available, and low-battery alerts.
            - Persistent 5, 15, and 30 minute countdown timers with pause, resume, stop, and completion alerts.
            - Google Maps next-turn directions, ETA, and live distance shown in meters.
            - Answer and decline buttons when the calling app publishes those actions in its notification.
            - Mark as read for notifications that expose a supported action.
          files: build_output/DynamicIsland-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
