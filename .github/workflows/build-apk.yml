name: Build Dynamic Island Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Rename and Stage APK
        run: |
          mkdir -p build_output
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk build_output/DynamicIsland-v1.0.0.apk
          else
            cp app/build/outputs/apk/debug/*.apk build_output/DynamicIsland-v1.0.0.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-APK
          path: build_output/DynamicIsland-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dynamic Island Android v1.0.0"
          body: |
            ### 📱 Dynamic Island for Android (APK)
            
            **Features:**
            - Floating Punch-Hole Camera Notch Overlay (`dynamicSpot` style).
            - Real-time Music Player with animated **Squiggly Wavy Scrubber Bar**.
            - Works with Spotify, YouTube Music, Apple Music, Chrome, SoundCloud, etc.
            - Real-time Charging and Battery Status.
            - Custom Notch X & Y position and size calibration sliders.
            
            **Installation:**
            1. Download `DynamicIsland-v1.0.0.apk` onto your phone.
            2. Tap to install (enable "Install unknown apps" if prompted).
            3. Open the app and grant **Overlay** and **Notification Access** permissions.
            4. Toggle **Enable Dynamic Island** and enjoy!
          files: build_output/DynamicIsland-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
