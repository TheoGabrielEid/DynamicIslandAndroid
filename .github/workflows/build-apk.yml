name: Build Dynamic Island Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "e: |ERROR:|FAILURE:|What went wrong" -A 3 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Rename and Stage APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/*.apk build_output/DynamicIsland-v1.0.0.apk
          ls -la build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-APK
          path: build_output/DynamicIsland-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dynamic Island Android Pro v1.0.0"
          body: |
            ### 📱 Dynamic Island for Android Pro (PC-Edition Match)
            
            **New Features & Upgrades:**
            - **5-Tab PC-Style Expanded Capsule**: `Media`, `System`, `Focus`, `Tools`, and `Apps` + Live Header Clock & Date, Pin `📌` lock, and horizontal swipe between tabs.
            - **Live Download (`DL`) & Upload (`UL`) Network Histograms + LAN/WAN/VPN Telemetry**: Matches your Windows PC Dynamic Island with 48-bar live traffic graphs, LAN IP, and WAN IP that turns **bright green (`VPN`)** when a VPN is active and **red** when unprotected.
            - **Vinyl Record Turntable & Glossy Cover Art (`AlbumArtView`)**: Spinning vinyl record disc when idle, glossy cover art with tap-to-open player app, and 12-bar live waveform visualizer + squiggly wavy scrubber.
            - **Circular Focus Ring Timer (`FocusRingView`)**: Smooth circular Pomodoro countdown dial (`5m`, `15m`, `25m`, `50m`).
            - **12 Accent Color Themes + OLED Specular Glint & Aura Glow**: Material Blue, Lavender, Mint, Peach, Cyan, Coral, Rose, Gold, Violet, Emerald, Crimson, and Sky.
            - **Live Clipboard Bar & Quick Apps Launcher**: Inspect/share copied text, pop up the Android Wi-Fi panel, or launch Spotify, YouTube, WhatsApp, Instagram, Maps, Browser, Dialer, and Messages.
          files: build_output/DynamicIsland-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
